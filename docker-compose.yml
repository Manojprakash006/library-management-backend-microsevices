services:
  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: library-api-gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - CORS_ORIGIN=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:7070
      - NODE_ENV=production
    depends_on:
      - library-books-service
      - library-members-service
      - library-issues-service
      - library-requests-service
      - library-payments-service
    networks:
      - app-network
    restart: unless-stopped

  # Library Books Service
  library-books-service:
    build:
      context: ./services/library-books-service
      dockerfile: Dockerfile
    container_name: library-books-service
    ports:
      - "3001:3001"
      - "5001:5001"
    environment:
      - PORT=3001
      - GRPC_URL=0.0.0.0:5001
      - NODE_ENV=production
      - MONGODB_URI=mongodb+srv://librarymanagement:UB5K9mJzSEG6tsCq@cluster0.niuwpgk.mongodb.net/
      - MONGODB_DB=BooksService
      - JWT_SECRET=your-secret-key
      - KAFKA_BROKER=localhost:9092
      - ISSUES_SERVICE_URL=http://library-issues-service:3013
      - MEMBERS_SERVICE_URL=http://library-members-service:3012
      - REQUESTS_SERVICE_URL=http://library-requests-service:3014
    depends_on:
      - mongodb
    networks:
      - app-network
    restart: unless-stopped

  # Library Members Service
  library-members-service:
    build:
      context: ./services/library-members-service
      dockerfile: Dockerfile
    container_name: library-members-service
    ports:
      - "3012:3012"
      - "5002:5002"
    environment:
      - PORT=3012
      - GRPC_URL=0.0.0.0:5002
      - NODE_ENV=production
      - MONGODB_URI=mongodb+srv://librarymanagement:UB5K9mJzSEG6tsCq@cluster0.niuwpgk.mongodb.net/
      - MONGODB_DB=Authentication
      - JWT_SECRET=your-secret-key
      - KAFKA_BROKER=localhost:9092
      - ISSUES_SERVICE_URL=http://library-issues-service:3013
      - BOOKS_SERVICE_URL=http://library-books-service:3001
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=mernstackdev.yoho@gmail.com
      - SMTP_PASS=xnwgmqkzeacaauag
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - mongodb
    networks:
      - app-network
    restart: unless-stopped

  # Library Issues Service
  library-issues-service:
    build:
      context: ./services/library-issues-service
      dockerfile: Dockerfile
    container_name: library-issues-service
    ports:
      - "3013:3013"
      - "5003:5003"
    environment:
      - PORT=3013
      - GRPC_URL=0.0.0.0:5003
      - NODE_ENV=production
      - MONGODB_URI=mongodb+srv://librarymanagement:UB5K9mJzSEG6tsCq@cluster0.niuwpgk.mongodb.net/
      - MONGODB_DB=IssueService
      - JWT_SECRET=your-secret-key
      - KAFKA_BROKER=localhost:9092
      - MEMBERS_SERVICE_URL=http://library-members-service:3012
      - BOOKS_SERVICE_URL=http://library-books-service:3001
      - PAYMENTS_SERVICE_URL=http://library-payments-service:3005
      
    depends_on:
      - mongodb
    networks:
      - app-network
    restart: unless-stopped

  # Library Requests Service
  library-requests-service:
    build:
      context: ./services/library-requests-service
      dockerfile: Dockerfile
    container_name: library-requests-service
    ports:
      - "3014:3014"
      - "5004:5004"
    environment:
      - PORT=3014
      - GRPC_URL=0.0.0.0:5004
      - NODE_ENV=production
      - MONGODB_URI=mongodb+srv://librarymanagement:UB5K9mJzSEG6tsCq@cluster0.niuwpgk.mongodb.net/
      - MONGODB_DB=RequestServices
      - JWT_SECRET=your-secret-key
      - KAFKA_BROKER=localhost:9092
      - ISSUES_SERVICE_URL=http://library-issues-service:3013
      - MEMBERS_SERVICE_URL=http://library-members-service:3012
      - BOOKS_SERVICE_URL=http://library-books-service:3001
    depends_on:
      - mongodb
    networks:
      - app-network
    restart: unless-stopped

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: library-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network
    restart: unless-stopped

  # Library Payments Service
  library-payments-service:
    build:
      context: ./services/library-payments-service
      dockerfile: Dockerfile
    container_name: library-payments-service
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - NODE_ENV=production
      - MONGODB_URI=mongodb+srv://librarymanagement:UB5K9mJzSEG6tsCq@cluster0.niuwpgk.mongodb.net/
      - MONGODB_DB=PaymentServices
      - JWT_SECRET=your-secret-key
      - KAFKA_BROKER=localhost:9092
      - RZP_KEY_ID=rzp_test_SaDCl7Au48PRQf
      - RZP_KEY_SECRET=Ge4uiF1mxjvZZ5LSXgy5PAZt
      - MEMBERS_SERVICE_URL=http://library-members-service:3012
      - BOOKS_SERVICE_URL=http://library-books-service:3001
    depends_on:
      - mongodb
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
